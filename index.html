<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devops-senao 的主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(102,126,234,0.4);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fff, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      margin-bottom: 32px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }

    .tag {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    .quote {
      background: rgba(102,126,234,0.15);
      border-left: 3px solid #667eea;
      border-radius: 8px;
      padding: 16px 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      line-height: 1.6;
      margin-bottom: 32px;
      text-align: left;
    }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      text-decoration: none;
      padding: 10px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(102,126,234,0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(102,126,234,0.5);
    }

    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">🚀</div>
    <h1>Devops-senao</h1>
    <p class="subtitle">GitHub 探索者 · 代码新手 · 持续成长中</p>

    <div class="tags">
      <span class="tag">🌱 正在学习</span>
      <span class="tag">⚙️ DevOps</span>
      <span class="tag">💻 开源爱好者</span>
      <span class="tag">🇨🇳 中国</span>
    </div>

    <div class="quote">
      "每一位大神，都曾是初学者。<br>
      今天迈出的第一步，就是明天的起点。"
    </div>

    <div class="links">
      <a class="btn" href="https://github.com/Devops-senao" target="_blank">
        🐙 GitHub 主页
      </a>
    </div>

    <p class="footer">用 ❤️ 和 GitHub Pages 构建</p>
  </div>
</body>
</html>
